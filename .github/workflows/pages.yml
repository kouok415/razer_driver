name: Verify and deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # zexrox at the commit pinned in tools/sources.manifest.json, as data
      # only: nothing in the clone is installed, built or run.
      - run: |
          git clone --no-checkout https://github.com/zexrox/huntsman-synapse-web "$RUNNER_TEMP/src/zexrox"
          git -C "$RUNNER_TEMP/src/zexrox" checkout -q 840f03dca68c7f7a3b8f867475a2c8e9a355a1bc
      - run: node tools/check-protocol-doc.mjs --require=all --groups=all --sources="$RUNNER_TEMP/src" --only=zexrox
      - run: npm run verify
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
